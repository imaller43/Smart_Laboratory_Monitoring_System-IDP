# ============================================================================
# Eclipse Mosquitto Topic ACL Rules (Least-Privilege)
# Any topic not explicitly granted below is automatically denied.
# ============================================================================

# 1. Node-RED backend service: full pub/sub access
user nodered_backend
topic readwrite #

# 2. ESP32-S3 Main Sensing Node: publish telemetry & subscribe to OTA trigger
user lab_main_s3
topic write lab_main_s3/telemetry
topic write +/telemetry
topic read esp32/ota_trigger

# 3. ESP32 Super Mini LoRa Fallback Gateway: forward telemetry & OTA trigger
user lab_gateway_mini
topic write +/telemetry
topic read esp32/ota_trigger
