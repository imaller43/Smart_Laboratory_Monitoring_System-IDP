# ============================================================================
# Eclipse Mosquitto 2.0 Configuration — Smart Laboratory Safety Monitoring
# Lightweight C MQTT broker (~10 MB RAM) tuned for Azure B2ats v2 (1 GiB RAM)
# ============================================================================

# Persistence (stored in mounted volume)
persistence true
persistence_location /mosquitto/data/

# Log to stdout so Docker json-file log rotation manages disk usage
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Strict authentication & topic ACLs (no anonymous connections)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# 1. Internal TCP MQTT listener (used by Node-RED over Docker bridge network)
listener 1883 0.0.0.0
protocol mqtt

# 2. MQTT over WebSockets listener (targeted by Cloudflare Tunnel: lab-mqtt.ikmaliman.my/mqtt)
listener 8083 0.0.0.0
protocol websockets
