<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Smart Laboratory Monitoring System</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body class="login-page">

  <div class="login-nav">
    <span class="login-brand">Smart Laboratory Monitoring System</span>
    <button type="button" class="theme-switch" id="themeToggle" title="Toggle Theme"></button>
  </div>

  <div class="login-box">
    <h1>ESP32 Login</h1>
    <div id="errorMsg">Incorrect username or password.</div>
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required autocomplete="username"><br>
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password"><br>
      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>

  <div class="site-footer">&copy; Smart Laboratory Monitoring System. All rights reserved.</div>

  <script>
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
  <script src="/app.js"></script>
</body>

</html>
